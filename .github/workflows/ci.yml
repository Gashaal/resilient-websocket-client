name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  static-checks:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run static checks
        run: npm run static-checks

      - name: Run tests
        run: npm run test

      - name: Run build
        run: npm run build
